# Production — VPS Ubuntu 24.04 + technovax.store
# Usage : docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  database:
    # 8.0.32 : compatible VPS anciens CPU (sans x86-64-v2)
    image: mysql:8.0.32
    container_name: technova_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-technova}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requis}
      MYSQL_USER: ${MYSQL_USER:-symfony}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requis}
    volumes:
      - db_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --performance-schema=OFF
      --skip-log-bin
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - technova_internal

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: technova_php
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?APP_SECRET requis}
      DATABASE_URL: mysql://${MYSQL_USER:-symfony}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE:-technova}?serverVersion=8.0.32&charset=utf8mb4
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-'^https://(www\.)?technovax\.store$'}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      DEFAULT_URI: ${DEFAULT_URI:-https://technovax.store}
      FRONTEND_URL: ${FRONTEND_URL:-https://technovax.store}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RUN_MIGRATIONS: "1"
    volumes:
      - php_var:/var/www/html/var
    depends_on:
      database:
        condition: service_healthy
    networks:
      - technova_internal

  nginx-symfony:
    image: nginx:alpine
    container_name: technova_nginx_symfony
    restart: unless-stopped
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx-symfony.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - technova_internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: technova_frontend
    restart: unless-stopped
    depends_on:
      - nginx-symfony
    networks:
      - technova_internal
      - technova_edge

  caddy:
    image: caddy:2-alpine
    container_name: technova_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-technovax.store}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL requis pour Let's Encrypt}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - technova_edge

volumes:
  db_data:
  php_var:
  caddy_data:
  caddy_config:

networks:
  technova_internal:
    driver: bridge
  technova_edge:
    driver: bridge
