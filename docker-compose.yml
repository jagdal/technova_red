services:
  database:
    image: mysql:8.0
    container_name: technova_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: technova
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: technova_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: change_me_docker_app_secret_32chars
      DATABASE_URL: "mysql://symfony:symfony@database:3306/technova?serverVersion=8.0.32&charset=utf8mb4"
      CORS_ALLOW_ORIGIN: "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
      JWT_SECRET: change_me_docker_jwt_secret_minimum_32_chars
      DEFAULT_URI: http://localhost
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLIC_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      FRONTEND_URL: http://localhost
    depends_on:
      database:
        condition: service_healthy

  nginx-symfony:
    image: nginx:alpine
    container_name: technova_nginx_symfony
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx-symfony.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    ports:
      - "8080:80"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: technova_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - nginx-symfony

volumes:
  db_data:
