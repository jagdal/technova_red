security:
    password_hashers:
        App\Entity\Client: 'auto'
        App\Entity\Admin: 'auto'

    providers:
        client_provider:
            entity:
                class: App\Entity\Client
                property: email
        admin_provider:
            entity:
                class: App\Entity\Admin
                property: email
        app_chain_provider:
            chain:
                providers: [client_provider, admin_provider]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            stateless: false
            lazy: true
            provider: app_chain_provider
            custom_authenticators:
                - App\Security\JwtAuthenticator

    access_control:
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api/contact, roles: PUBLIC_ACCESS }
        - { path: ^/api/catalogue, roles: PUBLIC_ACCESS }
        - { path: ^/api/paiements/stripe/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/sitemap\.xml$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api/produits$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/categories$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/panier, roles: ROLE_CLIENT }
        - { path: ^/api/commandes, roles: ROLE_CLIENT }
        - { path: ^/api/paiements, roles: ROLE_CLIENT }
        - { path: ^/api/favoris, roles: ROLE_CLIENT }
        - { path: ^/api/avis, roles: ROLE_CLIENT }

when@test:
    security:
        password_hashers:
            App\Entity\Client:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
            App\Entity\Admin:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
