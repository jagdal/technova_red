# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    stripe.secret.default: ''
    stripe.webhook.default: ''
    frontend.url.default: 'http://localhost:5173'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Security\TokenService:
        arguments:
            $jwtSecret: '%env(JWT_SECRET)%'

    App\Security\StatelessCsrfService:
        arguments:
            $appSecret: '%env(APP_SECRET)%'

    App\Service\StripePaymentService:
        arguments:
            $stripeSecretKey: '%env(default:stripe.secret.default:STRIPE_SECRET_KEY)%'
            $stripeWebhookSecret: '%env(default:stripe.webhook.default:STRIPE_WEBHOOK_SECRET)%'
            $frontendUrl: '%env(default:frontend.url.default:FRONTEND_URL)%'
